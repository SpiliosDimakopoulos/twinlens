name: experiments
# Model runs that are too slow for every push but light enough for a hosted runner:
# the attribution-patching baseline and a sample `twinlens audit`. Run it from the Actions tab,
# or add the label `run-experiments` to a pull request.
on:
  workflow_dispatch: {}
  pull_request:
    types: [labeled]
permissions:
  contents: read
env:
  TWINLENS_CACHE: ${{ github.workspace }}/.hf_cache
jobs:
  atp-baseline:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-experiments'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v6
        with: { path: .hf_cache, key: hf-gpt2-transcoders-v1 }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: python experiments/atp_baseline.py
      - run: python experiments/analyze_atp.py
      - name: Sample audits
        run: |
          mkdir -p out
          twinlens audit "When Mary and John went to the store, John gave a drink to" --top 8 > out/audit.txt
          twinlens audit "The Colosseum is located in the city of" --top 6 --json > out/audit.json
          pip freeze --exclude-editable > out/requirements.lock.txt
      - uses: actions/upload-artifact@v7
        with:
          name: experiments-output
          path: |
            experiments/results/fidelity_atp.parquet
            experiments/results/summary.json
            out
