name: ci
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # Same location twinlens/core/weights.py downloads into, so the cache step below caches it.
  TWINLENS_CACHE: ${{ github.workspace }}/.hf_cache
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with: { path: .hf_cache, key: hf-gpt2-transcoders-v1 }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check twinlens server tests experiments
      - run: pytest -q --timeout=900
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint src
      - run: npm test
      - run: npm run build
  static-e2e:
    # The GitHub Pages demo: build it, serve it under /twinlens/ and run its Playwright tests.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:static
      - run: mkdir -p /tmp/site && cp -r dist-static /tmp/site/twinlens
      - name: Serve the static site
        run: |
          (cd /tmp/site && nohup python3 -m http.server 8001 --bind 127.0.0.1 > /tmp/http.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8001/twinlens/ && exit 0
            sleep 1
          done
          echo "static server did not come up"; cat /tmp/http.log; exit 1
      - run: npx playwright test -c playwright.static.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
  live-e2e:
    # The full dashboard against the real API and model (flows, keyboard, dark mode, phone width).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with: { path: .hf_cache, key: hf-gpt2-transcoders-v1 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[server]"
      - run: cd web && npm ci && npx playwright install --with-deps chromium && npm run build
      - name: Start the API with the built dashboard
        run: |
          nohup python -m uvicorn server.app:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8000/api/health && exit 0
            sleep 2
          done
          cat /tmp/api.log; exit 1
      - run: cd web && npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-e2e-screenshots
          path: |
            docs/screenshots
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t twinlens .
