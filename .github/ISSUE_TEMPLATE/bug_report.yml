name: Bug report
description: Something is broken or a number looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command (e.g. `twinlens audit "..."`), or the dashboard URL (every view is a shareable link).
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, browser
