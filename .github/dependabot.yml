version: 2
# One grouped PR per ecosystem per month. Major versions are left out: they need a human look
# (a new TypeScript, Python or Node major can break the build), so they are upgraded by hand.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
